name: EDGE Frontend Smoke

on:
  pull_request:
    paths:
      - "index.html"
      - "web-push.js"
      - "sw.js"
      - "scripts/edge-frontend-smoke.mjs"
      - "scripts/edge-visual-check.cjs"
      - ".github/workflows/frontend-smoke.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "web-push.js"
      - "sw.js"
      - "scripts/edge-frontend-smoke.mjs"
      - "scripts/edge-visual-check.cjs"
      - ".github/workflows/frontend-smoke.yml"

permissions:
  contents: read

jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JS and recovery behavior
        run: node scripts/edge-frontend-smoke.mjs

      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify responsive UI and decision states
        run: node scripts/edge-visual-check.cjs
      - name: Save visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-design-screenshots
          path: visual-results/
          if-no-files-found: ignore
