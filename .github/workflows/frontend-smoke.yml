name: EDGE Frontend Smoke

on:
  pull_request:
    paths:
      - "index.html"
      - "web-push.js"
      - "sw.js"
      - "scripts/edge-frontend-smoke.mjs"
      - ".github/workflows/frontend-smoke.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "web-push.js"
      - "sw.js"
      - "scripts/edge-frontend-smoke.mjs"
      - ".github/workflows/frontend-smoke.yml"

permissions:
  contents: read

jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JS and recovery behavior
        run: node scripts/edge-frontend-smoke.mjs
