name: EDGE Frontend Smoke

on:
  pull_request:
    paths:
      - "index.html"
      - "web-push.js"
      - "trade-log.js"
      - "trade-log.css"
      - "trade-snapshot.js"
      - "trade-snapshot.css"
      - "sw.js"
      - "scripts/edge-frontend-smoke.mjs"
      - "scripts/edge-visual-check.cjs"
      - ".github/workflows/frontend-smoke.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "web-push.js"
      - "trade-log.js"
      - "trade-log.css"
      - "trade-snapshot.js"
      - "trade-snapshot.css"
      - "sw.js"
      - "scripts/edge-frontend-smoke.mjs"
      - "scripts/edge-visual-check.cjs"
      - ".github/workflows/frontend-smoke.yml"

permissions:
  contents: read

jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JS, snapshot controls, and recovery behavior
        run: |
          node --check trade-snapshot.js
          node --check trade-log.js
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');for(const t of ['A','B','C'])if(!s.includes('data-edge-snapshot-tier=\"' + t + '\"'))process.exit(1);if(!s.includes('/trade-snapshot.js'))process.exit(1)"
          node scripts/edge-frontend-smoke.mjs

      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify responsive UI and decision states
        run: node scripts/edge-visual-check.cjs
      - name: Save visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-design-screenshots
          path: visual-results/
          if-no-files-found: ignore
